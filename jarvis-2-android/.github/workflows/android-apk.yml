name: JARVIS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['jarvis-2-android/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-2-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-2-android/package.json
      - run: npm install
      - run: npx expo-doctor
      - run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
